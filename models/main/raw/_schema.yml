version: 2

models:
  - name: raw_lg_code
    description: 総務省 全国地方公共団体コード（市町村別コード・現行）の生データ
    columns:
      - name: lg_code
        description: 団体コード（6桁、チェックディジット込み）
      - name: prefecture
        description: 都道府県名（漢字）
      - name: city
        description: 市区町村名（漢字）。都道府県レコードでは NULL
      - name: prefecture_kana
        description: 都道府県名（半角カナ）
      - name: city_kana
        description: 市区町村名（半角カナ）。都道府県レコードでは NULL
  - name: raw_lg_code_ward
    description: 総務省 全国地方公共団体コードのうち、政令指定都市とその区の生データ

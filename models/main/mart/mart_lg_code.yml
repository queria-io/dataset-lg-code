version: 2

models:
  - name: mart_lg_code
    description: 総務省が定める全国地方公共団体コード（団体コード）のマスタ。都道府県・市区町村等の6桁コードと5桁コード、都道府県コード、名称（漢字・カナ）、団体区分を収録する。政令指定都市の区も code_type = ward の行として含む。
    access: public
    config:
      contract:
        enforced: true
    columns:
      - name: lg_code
        data_type: VARCHAR
      - name: pref_code
        data_type: VARCHAR
      - name: lg_code_5
        data_type: VARCHAR
      - name: prefecture
        data_type: VARCHAR
      - name: city
        data_type: VARCHAR
      - name: prefecture_kana
        data_type: VARCHAR
      - name: city_kana
        data_type: VARCHAR
      - name: code_type
        data_type: VARCHAR
